name = "vinylnight"
compatibility_date = "2025-01-01"
main = "src/index.js"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "vinylnight-db"
database_id = "5ea0f19b-dd09-494b-a601-0109953b55ce"

# Cloudflare R2 bucket (avatar image storage)
# Uncomment when ready to provision:
# [[r2_buckets]]
# binding = "AVATARS"
# bucket_name = "vinylnight-avatars"

[vars]
ENVIRONMENT = "development"
MUSICBRAINZ_USER_AGENT = "vinylnight/1.0 (https://vinylnight.net)"
